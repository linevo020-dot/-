<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#343a40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="地盤改良樁">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>地盤改良樁施工 App</title>
<style>
:root{--primary:#007bff;--success:#28a745;--warning:#fd7e14;--danger:#dc3545;--dark:#343a40}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f8f9fa;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
.app-header{background:var(--dark);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 15px 12px;text-align:center;position:sticky;top:0;z-index:1000;box-shadow:0 2px 5px #0003}
.project-title{font-size:17px;font-weight:700;margin:0}
.install-badge{font-size:11px;color:#d9e8ff;margin-top:4px}
.tab-bar{display:flex;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:68px;z-index:1000}
.tab-btn{flex:1;padding:13px 5px;border:0;background:none;font-size:14px;font-weight:700;color:#666;border-bottom:3px solid transparent}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.app-content{padding:10px;display:none}.app-content.active{display:block}
.card{background:#fff;padding:11px;border-radius:9px;margin-bottom:10px;box-shadow:0 1px 3px #0002;border:1px solid #e0e0e0}
.card h4{margin:0 0 9px;font-size:13px;color:#666}
.row{display:flex;gap:7px;align-items:center;margin-bottom:7px}
button,select,input{padding:10px;font-size:14px;border:1px solid #ccc;border-radius:6px}
button{touch-action:manipulation}
.btn-block{width:100%;cursor:pointer}.btn-primary{background:var(--primary);color:#fff;font-weight:700;border:0}.btn-success{background:var(--success);color:#fff;font-weight:700;border:0}.btn-danger{background:var(--danger);color:#fff;font-weight:700;border:0}
.mode-active{outline:3px solid #80bdff}
#map-container{width:100%;height:55vh;min-height:360px;border:1px solid #ccc;border-radius:9px;background:#e9ecef;z-index:1;overflow:hidden}
.custom-marker{width:14px!important;height:14px!important;margin-left:-7px!important;margin-top:-7px!important;border-radius:50%;background:#343a;border:1px solid #fff;color:#fff;font-size:8px;font-weight:700;text-align:center;line-height:12px;box-shadow:0 1px 3px #0007;transition:.15s}
.custom-marker.m1-done{background:var(--success)!important;width:20px!important;height:20px!important;margin-left:-10px!important;margin-top:-10px!important;line-height:18px;font-size:9px}
.custom-marker.m2-done{background:var(--warning)!important;width:20px!important;height:20px!important;margin-left:-10px!important;margin-top:-10px!important;line-height:18px;font-size:9px}
.machine-title{font-size:15px;font-weight:700;padding:8px 12px;border-radius:4px;color:#fff;margin-bottom:7px}.m1-title{background:var(--success)}.m2-title{background:var(--warning)}
.table-responsive{overflow-x:auto;background:#fff;border-radius:6px;border:1px solid #ddd}
table{width:100%;border-collapse:collapse;text-align:left;font-size:12px;white-space:nowrap}th,td{padding:8px 9px;border-bottom:1px solid #eee}th{background:#f1f3f5}
.modal{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;padding:18px;border-radius:16px 16px 0 0;box-shadow:0 -4px 15px #0003;z-index:10000}
.modal-overlay{display:none;position:fixed;inset:0;background:#0006;z-index:9999}
.form-group{margin-bottom:11px;display:flex;flex-direction:column;gap:4px}.form-group label{font-size:13px;font-weight:700;color:#666}
#file-input-label{background:#6c757d;color:#fff;padding:10px;border-radius:6px;text-align:center;display:block;font-weight:700;cursor:pointer;font-size:14px}
.status{font-size:12px;color:#666}.small{font-size:11px;color:#777}
.leaflet-control-attribution{font-size:8px!important}
</style>
</head>
<body>
<div class="app-header">
  <p class="project-title" id="app-project-name">改良樁現場施工系統</p>
  <div class="install-badge" id="install-status">📱 網頁版／可安裝至手機桌面</div>
</div>
<div class="tab-bar">
<button class="tab-btn active" id="tab-map-btn" onclick="switchTab('map')">🗺️ 圖面標記</button>
<button class="tab-btn" id="tab-data-btn" onclick="switchTab('data')">📊 機組數據</button>
</div>

<div id="tab-map" class="app-content active">
<div class="card">
<h4>📁 1. 載入本地工程圖紙</h4>
<div class="row">
<input type="file" id="image-loader" accept="image/*" onchange="loadImageFromDevice(event)" style="display:none">
<label id="file-input-label" for="image-loader" style="flex:1">📂 點擊選取手機相簿圖紙</label>
</div>
<div class="small">圖紙與施工資料會保存在本機瀏覽器，不需上傳伺服器。</div>
</div>

<div class="card">
<h4>⚙️ 2. 專案管理與模式切換</h4>
<div class="row"><input type="text" id="input-project-name" value="改良樁現場施工系統" onchange="updateProjectName()" style="flex:1" placeholder="修改專案名稱"></div>
<div class="row">
<button id="btn-setup" class="btn-primary mode-active" style="flex:1" onclick="switchMode('setup')">1. 樁位建檔</button>
<button id="btn-check" style="flex:1" onclick="switchMode('check')">2. 現場施工</button>
</div>
<div class="row" id="machine-selector-row" style="display:none">
<span style="font-weight:bold;font-size:13px;min-width:70px">作業機組：</span>
<select id="current-machine" style="flex:1">
<option value="機台1">🚜 機台 1（綠點）</option>
<option value="機台2">🏗️ 機台 2（橘點）</option>
</select>
</div>
</div>

<div id="map-container"><div style="text-align:center;line-height:50vh;color:#999;font-weight:bold">請先選取工程圖紙</div></div>
</div>

<div id="tab-data" class="app-content">
<div class="card" style="display:flex;gap:8px">
<button class="btn-block btn-success" style="flex:2" onclick="exportToCSV()">📥 匯出 CSV / Excel</button>
<button class="btn-block btn-danger" style="flex:1" onclick="clearAllData()">⚠️ 清空重置</button>
</div>
<div class="card"><div class="status" id="summary"></div></div>
<div class="machine-section">
<div class="machine-title m1-title">🚜 機台 1 施作紀錄</div>
<div class="table-responsive"><table><thead><tr><th>完成順序</th><th>施工編號</th><th>建檔對應號</th><th>樁種類</th><th>設計深度(m)</th></tr></thead><tbody id="table-m1-body"></tbody></table></div>
</div>
<div class="machine-section">
<div class="machine-title m2-title">🏗️ 機台 2 施作紀錄</div>
<div class="table-responsive"><table><thead><tr><th>完成順序</th><th>施工編號</th><th>建檔對應號</th><th>樁種類</th><th>設計深度(m)</th></tr></thead><tbody id="table-m2-body"></tbody></table></div>
</div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal()"></div>
<div class="modal" id="record-modal">
<h3 id="modal-title" style="margin-top:0;font-size:16px">機台施工紀錄</h3>
<div class="form-group"><label>改良樁種類</label>
<select id="field-type"><option>機械深層攪拌樁(DSM)</option><option>雙層管高壓噴射樁(JSP)</option><option>CCP微型噴射樁</option></select></div>
<div class="form-group"><label>改良樁設計深度（米）</label>
<select id="field-depth"><option value="10.5">10.5 m</option><option value="12.0">12.0 m</option><option value="15.5">15.5 m</option><option value="18.0">18.0 m</option></select></div>
<button class="btn-block btn-primary" onclick="saveRecord()">儲存並完成此樁</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const STORAGE_KEY='ground_improvement_pile_pwa_v1';
let currentMode='setup',markersData=[],setupCounter=1,activeMarkerForRecord=null;
let machineSequences={機台1:1,機台2:1},map,imageLayer,savedImageData=null;

window.addEventListener('load',()=>{
 map=L.map('map-container',{crs:L.CRS.Simple,minZoom:-5,maxZoom:5,zoomControl:true,zoomSnap:.25});
 map.on('click',e=>handleMapClick(e.latlng));
 loadFromLocalStorage();
 registerSW();
});
function saveToLocalStorage(){
 localStorage.setItem(STORAGE_KEY,JSON.stringify({projectName:document.getElementById('input-project-name').value,
 markersData,setupCounter,machineSequences,savedImageData}));
}
function loadFromLocalStorage(){
 try{
  const d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
  if(!d)return;
  document.getElementById('input-project-name').value=d.projectName||'改良樁現場施工系統';
  document.getElementById('app-project-name').innerText=d.projectName||'改良樁現場施工系統';
  markersData=Array.isArray(d.markersData)?d.markersData:[];
  setupCounter=d.setupCounter||1; machineSequences=d.machineSequences||{機台1:1,機台2:1};
  savedImageData=d.savedImageData||null;
  if(savedImageData)renderMapImage(savedImageData); else renderMarkers();
  updateTables();
 }catch(e){console.error(e)}
}
function loadImageFromDevice(event){
 const file=event.target.files[0]; if(!file)return;
 const reader=new FileReader();
 reader.onload=e=>{savedImageData=e.target.result;renderMapImage(savedImageData);saveToLocalStorage()};
 reader.readAsDataURL(file);
}
function renderMapImage(base64){
 if(imageLayer)map.removeLayer(imageLayer);
 const img=new Image();
 img.onload=()=>{
  const bounds=[[0,0],[img.height,img.width]];
  imageLayer=L.imageOverlay(base64,bounds,{interactive:false}).addTo(map);
  map.fitBounds(bounds); document.getElementById('file-input-label').innerText='✅ 圖紙載入成功（可更換）';
  renderMarkers();
 };
 img.src=base64;
}
function updateProjectName(){
 const n=document.getElementById('input-project-name').value.trim()||'改良樁現場施工系統';
 document.getElementById('app-project-name').innerText=n;saveToLocalStorage();
}
function switchTab(tab){
 document.getElementById('tab-map').classList.toggle('active',tab==='map');
 document.getElementById('tab-data').classList.toggle('active',tab==='data');
 document.getElementById('tab-map-btn').classList.toggle('active',tab==='map');
 document.getElementById('tab-data-btn').classList.toggle('active',tab==='data');
 if(tab==='map')setTimeout(()=>map.invalidateSize(),100);
}
function switchMode(mode){
 currentMode=mode;
 document.getElementById('machine-selector-row').style.display=mode==='check'?'flex':'none';
 document.getElementById('btn-setup').classList.toggle('btn-primary',mode==='setup');
 document.getElementById('btn-setup').classList.toggle('mode-active',mode==='setup');
 document.getElementById('btn-check').classList.toggle('btn-primary',mode==='check');
 document.getElementById('btn-check').classList.toggle('mode-active',mode==='check');
}
function handleMapClick(latlng){
 if(!savedImageData){alert('請先載入工程圖紙。');return}
 if(currentMode==='setup'){
  const m={id:Date.now()+Math.random(),setupNo:setupCounter++,lat:latlng.lat,lng:latlng.lng,status:'setup',machine:null,sequence:null,type:null,depth:null};
  markersData.push(m);renderMarkers();saveToLocalStorage();return;
 }
 const hit=findMarkerAt(latlng);
 if(!hit){return}
 if(hit.status==='setup'){activeMarkerForRecord=hit;openModal(hit)}
 else if(hit.status==='done'){undoMarker(hit)}
}
function findMarkerAt(latlng){
 let best=null,dist=Infinity;
 markersData.forEach(m=>{
  const d=map.distance(latlng,L.latLng(m.lat,m.lng));
  if(d<dist){dist=d;best=m}
 });
 const threshold=Math.max(18, map.getZoom()<0?50:25);
 return dist<=threshold?best:null;
}
function makeIcon(m){
 let cls='custom-marker',label=m.setupNo;
 if(m.status==='done'){
  cls+=' '+(m.machine==='機台1'?'m1-done':'m2-done');
  label=m.machine==='機台1'?'A'+m.sequence:'B'+m.sequence;
 }
 return L.divIcon({className:'',html:`<div class="${cls}">${label}</div>`,iconSize:null});
}
let markerLayers=[];
function renderMarkers(){
 markerLayers.forEach(x=>map.removeLayer(x));markerLayers=[];
 if(!map)return;
 markersData.forEach(m=>{
  const layer=L.marker([m.lat,m.lng],{icon:makeIcon(m),interactive:true,zIndexOffset:1000});
  layer.on('click',e=>{L.DomEvent.stopPropagation(e);if(currentMode==='check'){if(m.status==='setup'){activeMarkerForRecord=m;openModal(m)}else undoMarker(m)}});
  layer.addTo(map);markerLayers.push(layer);
 });
}
function openModal(m){
 const machine=document.getElementById('current-machine').value;
 document.getElementById('modal-title').innerText=`${machine}｜建檔樁號 ${m.setupNo}`;
 document.getElementById('modal-overlay').style.display='block';
 document.getElementById('record-modal').style.display='block';
}
function closeModal(){document.getElementById('modal-overlay').style.display='none';document.getElementById('record-modal').style.display='none';activeMarkerForRecord=null}
function saveRecord(){
 const m=activeMarkerForRecord;if(!m)return;
 const machine=document.getElementById('current-machine').value;
 const seq=machineSequences[machine]++;
 m.status='done';m.machine=machine;m.sequence=seq;
 m.type=document.getElementById('field-type').value;m.depth=document.getElementById('field-depth').value;
 closeModal();renderMarkers();updateTables();saveToLocalStorage();
}
function undoMarker(m){
 if(m.status!=='done')return;
 const code=m.machine==='機台1'?'A':'B';
 if(!confirm(`確定取消 ${code}${m.sequence}（建檔號 ${m.setupNo}）？\n取消後該機台最新流水號會回退。`))return;
 const machine=m.machine,seq=m.sequence;
 m.status='setup';m.machine=null;m.sequence=null;m.type=null;m.depth=null;
 // 只允許取消該機台目前最後一筆時回退；若不是最後一筆，重新整理該機台流水號避免重號
 if(machineSequences[machine]===seq+1) machineSequences[machine]=seq;
 else recalcSequence(machine);
 renderMarkers();updateTables();saveToLocalStorage();
}
function recalcSequence(machine){
 const arr=markersData.filter(m=>m.status==='done'&&m.machine===machine).sort((a,b)=>a.sequence-b.sequence);
 arr.forEach((m,i)=>m.sequence=i+1);machineSequences[machine]=arr.length+1;
}
function tableRows(machine){
 return markersData.filter(m=>m.status==='done'&&m.machine===machine).sort((a,b)=>a.sequence-b.sequence);
}
function updateTables(){
 ['機台1','機台2'].forEach(machine=>{
  const id=machine==='機台1'?'table-m1-body':'table-m2-body',el=document.getElementById(id),rows=tableRows(machine);
  el.innerHTML=rows.length?rows.map(m=>`<tr><td>${m.sequence}</td><td><b>${machine==='機台1'?'A':'B'}${m.sequence}</b></td><td>${m.setupNo}</td><td>${m.type}</td><td>${m.depth}</td></tr>`).join(''):`<tr><td colspan="5" style="text-align:center;color:#999">暫無施作數據</td></tr>`;
 });
 const a=tableRows('機台1').length,b=tableRows('機台2').length;
 document.getElementById('summary').innerText=`目前施工完成：機台1 ${a} 支、機台2 ${b} 支，共 ${a+b} 支；建檔樁位 ${markersData.length} 支。`;
}
function exportToCSV(){
 const rows=[['專案名稱',document.getElementById('input-project-name').value],[],['機台','施工編號','建檔對應號','改良樁種類','設計深度(m)']];
 ['機台1','機台2'].forEach(machine=>tableRows(machine).forEach(m=>rows.push([machine,(machine==='機台1'?'A':'B')+m.sequence,m.setupNo,m.type,m.depth])));
 const csv='\\ufeff'+rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${document.getElementById('input-project-name').value||'施工紀錄'}_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);
}
function clearAllData(){
 if(!confirm('確定清空所有樁位、施工資料與圖紙？此操作無法復原。'))return;
 localStorage.removeItem(STORAGE_KEY);location.reload();
}
function registerSW(){
 if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);
}
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{
 e.preventDefault();deferredPrompt=e;
 document.getElementById('install-status').innerText='📲 可以安裝到手機桌面';
});
window.addEventListener('appinstalled',()=>{document.getElementById('install-status').innerText='✅ 已安裝為手機 App'});
</script>
</body>
</html>
